---
# ==============================================================================
# Ansible Playbook: Automated DevOps Environment Provisioning for RecruitX
# Automates verification and environment state management of:
# - Git (SCM)
# - Node.js & npm (Frontend & Backend runtime)
# - Python 3 & pip (Selenium Automation)
# - OpenJDK / Java (Jenkins Automation Server)
# - Docker CLI & Daemon requirements
# ==============================================================================

- name: Provision & Verify DevOps Environment for RecruitX Project
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    project_root: "/mnt/c/FINAL YEAR PROJECT"

  tasks:
    - name: Display Operating System and Architecture
      ansible.builtin.debug:
        msg: "Target OS: {{ ansible_facts['os_family'] }} (Distribution: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"

    - name: Verify Git Installation
      ansible.builtin.command: git --version
      register: git_version_output
      changed_when: false

    - name: Display Git Version
      ansible.builtin.debug:
        msg: "✅ Git SCM Installed: {{ git_version_output.stdout }}"

    - name: Verify Python 3 Installation
      ansible.builtin.command: python3 --version
      register: python_version_output
      changed_when: false

    - name: Display Python Version
      ansible.builtin.debug:
        msg: "✅ Python Runtime Installed: {{ python_version_output.stdout }}"

    - name: Verify Node.js Environment
      ansible.builtin.command: cmd.exe /c "node --version"
      register: node_version_output
      changed_when: false
      ignore_errors: yes

    - name: Display Node.js Version
      ansible.builtin.debug:
        msg: "✅ Node.js Version: {{ node_version_output.stdout }}"

    - name: Verify Java / OpenJDK Runtime (for Jenkins)
      ansible.builtin.command: cmd.exe /c "java -version"
      register: java_version_output
      changed_when: false
      ignore_errors: yes

    - name: Display Java Version
      ansible.builtin.debug:
        msg: "✅ Java Runtime verified for Jenkins CI/CD engine"

    - name: Verify Docker CLI Availability
      ansible.builtin.command: cmd.exe /c "docker --version"
      register: docker_version_output
      changed_when: false
      ignore_errors: yes

    - name: Display Docker Version
      ansible.builtin.debug:
        msg: "✅ Docker Version: {{ docker_version_output.stdout }}"

    - name: Ensure Project DevOps Artifact Directories Exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ project_root }}/devops/task1-git"
        - "{{ project_root }}/devops/task2-jenkins"
        - "{{ project_root }}/devops/task3-selenium"
        - "{{ project_root }}/devops/task4-docker"
        - "{{ project_root }}/devops/task5-ansible-chef"

    - name: Summary of Environment Provisioning
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "🎯 ANSIBLE PLAYBOOK PROVISIONING SUMMARY:"
          - " - SCM (Git): OPERATIONAL"
          - " - Language Runtime (Node.js & Python): OPERATIONAL"
          - " - CI/CD Engine (Jenkins & Java): OPERATIONAL"
          - " - Containerization Engine (Docker): OPERATIONAL"
          - "=========================================================="
